<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Monitor — authorization callback</title>
<style>
  body { font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; max-width: 720px; margin: 60px auto; padding: 0 20px; }
  code { background: #f2f2f4; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .ok { color: #0a7d33; font-weight: 600; }
  .warn { color: #b54708; font-weight: 600; }
</style>
</head>
<body>
  <h2>Shorts Monitor — authorization</h2>
  <p id="status" class="warn">Передаю код авторизации на локальное приложение…</p>
  <p>Если ничего не произошло, скопируй адрес страницы целиком и вернись в терминал:</p>
  <p><code id="full"></code></p>
  <p>Код: <code id="code"></code></p>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code") || "";
    document.getElementById("full").textContent = location.href;
    document.getElementById("code").textContent = code || "код не найден";
    if (code) {
      const target = "http://127.0.0.1:8080/callback?" + params.toString();
      fetch(target, { mode: "no-cors" })
        .then(() => {
          document.getElementById("status").textContent = "Готово: код передан приложению, окно можно закрыть.";
          document.getElementById("status").className = "ok";
        })
        .catch(() => {
          document.getElementById("status").textContent = "Автопередача не сработала — скопируй адрес ниже.";
        });
    }
  </script>
</body>
</html>
